<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MON Sneakz | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f3f1;
        --panel: #ffffff;
        --accent: #f15a24;
        --text: #1e1e1e;
        --muted: #696969;
        --border: #e6e1dd;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Roboto", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      a { text-decoration: none; color: inherit; }
      button, input { font: inherit; }

      .header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255,255,255,0.96);
        border-bottom: 1px solid var(--border);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .logo-box {
        background: #fff;
        border: 2px solid #111;
        padding: 8px 14px;
        text-align: center;
        box-shadow: 0 2px 0 rgba(0,0,0,0.12);
      }

      .brand-text {
        font-size: clamp(16px, 1.7vw, 24px);
        font-weight: 900;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .nav-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .nav-link {
        font-weight: 600;
        color: var(--text);
      }

      .cart-badge {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #f4f4f4;
        border: 1px solid #d9d9d9;
        display: grid;
        place-items: center;
      }

      .cart-badge .badge {
        position: absolute;
        top: -4px;
        right: -2px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        background: #e93d3d;
        color: white;
        font-size: 10px;
        font-weight: 700;
        border-radius: 999px;
        display: grid;
        place-items: center;
        line-height: 1;
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 18px 60px;
      }

      .cart-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }

      .cart-panel,
      .summary-panel {
        background: white;
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      }

      .cart-panel {
        flex: 2;
        padding: 20px;
      }

      .summary-panel {
        flex: 1;
        padding: 20px;
      }

      .cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid #eee;
      }

      .cart-item:first-child { padding-top: 0; }

      .cart-product {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }

      .cart-product img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        border-radius: 12px;
        background: #f7f7f7;
      }

      .cart-product strong {
        display: block;
        margin-bottom: 4px;
      }

      .cart-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mini-btn {
        border: 1px solid #d9d9d9;
        background: #f2f2f2;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
      }

      .cart-price {
        min-width: 120px;
        text-align: right;
        font-weight: 700;
      }

      .summary-box {
        display: grid;
        gap: 12px;
      }

      .summary-box h3 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
      }

      .summary-row.total {
        color: var(--text);
        font-size: 20px;
        font-weight: 800;
        margin-top: 8px;
      }

      .checkout-btn {
        margin-top: 10px;
        width: 100%;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        padding: 14px 16px;
        cursor: pointer;
      }

      .empty-cart {
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .cart-layout {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body data-page="cart">
    <header class="header">
      <div class="header-inner">
        <div class="logo-box">
          <span class="brand-text">MON SNEAKZ</span>
        </div>

        <div class="nav-row">
          <a href="first.html" class="nav-link">Shop</a>
          <a href="seller.html" class="nav-link">Seller</a>
          <a href="cart.html" class="cart-badge" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <circle cx="9" cy="19" r="1"></circle>
              <circle cx="18" cy="19" r="1"></circle>
              <path d="M2 3h3l2.4 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L18.7 7H6"></path>
            </svg>
            <span class="badge" data-cart-count>0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="cart-layout">
        <section class="cart-panel">
          <h2>Your Cart</h2>
          <div id="cartItems"></div>
        </section>

        <aside class="summary-panel">
          <div class="summary-box">
            <h3>Summary</h3>
            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="cartTotal">0.00 $</strong>
            </div>
            <div class="summary-row">
              <span>Shipping</span>
              <span>Free</span>
            </div>
            <div class="summary-row total">
              <span>Total</span>
              <span id="cartTotalFinal">0.00 $</span>
            </div>
            <button class="checkout-btn" id="checkoutButton" type="button">Checkout</button>
          </div>
        </aside>
      </div>
    </main>

    <script src="products.js"></script>
  </body>
</html>
