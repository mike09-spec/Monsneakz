<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MON Sneakz | Seller Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f3f1;
        --panel: #ffffff;
        --accent: #f15a24;
        --text: #1e1e1e;
        --muted: #696969;
        --border: #e6e1dd;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Roboto", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      a { text-decoration: none; color: inherit; }
      button, input, select { font: inherit; }

      .header {
        background: rgba(255,255,255,0.96);
        border-bottom: 1px solid var(--border);
      }

      .header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        background: #fff;
        border: 2px solid #111;
        padding: 8px 14px;
        text-align: center;
        box-shadow: 0 2px 0 rgba(0,0,0,0.12);
      }

      .brand-text {
        font-size: clamp(16px, 1.7vw, 24px);
        font-weight: 900;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 18px 60px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 10px 26px rgba(0,0,0,0.04);
        padding: 22px;
      }

      .login-card {
        max-width: 500px;
        margin: 40px auto 0;
      }

      .seller-form {
        display: grid;
        gap: 12px;
      }

      .seller-form label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      .seller-form input,
      .seller-form select {
        padding: 12px 14px;
        border: 1px solid #d4d4d4;
        border-radius: 10px;
      }

      .upload-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border: 1px dashed #d4d4d4;
        border-radius: 10px;
        background: #fafafa;
      }

      .upload-box input[type="file"] {
        padding: 0;
        border: none;
        background: transparent;
      }

      .preview-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-height: 52px;
      }

      .preview-image {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #e8e8e8;
        background: #f7f7f7;
      }

      .preview-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .remove-preview {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        background: rgba(0,0,0,0.7);
        color: white;
        font-weight: 700;
        display: grid;
        place-items: center;
      }

      .primary-btn,
      .danger-btn,
      .second-btn,
      .ghost-btn {
        border: none;
        cursor: pointer;
        border-radius: 10px;
        font-weight: 700;
      }

      .primary-btn {
        background: var(--accent);
        color: white;
        padding: 12px 16px;
      }

      .second-btn {
        background: #ececec;
        color: var(--text);
        padding: 10px 14px;
      }

      .ghost-btn {
        background: #f2f2f2;
        color: var(--text);
        padding: 9px 12px;
      }

      .danger-btn {
        background: #fce4e1;
        color: #a33327;
        padding: 8px 12px;
      }

      .dashboard {
        display: none;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
      }

      .seller-product-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid #eee;
      }

      .demo-box {
        background: #fff5f1;
        border: 1px solid #ffd6c4;
        color: #6d3e2a;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 16px;
      }

      .logout-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 12px;
      }

      @media (max-width: 760px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-page="seller">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-text">MON SNEAKZ</span>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <a href="first.html" style="font-weight:700;">Shop</a>
          <a href="cart.html" style="font-weight:700;">Cart</a>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="card login-card" id="sellerLoginCard">
        <h2>Seller Login</h2>
        <div class="demo-box">Demo admin: username <strong>seller</strong> · password <strong>monsneakz123</strong></div>
        <form class="seller-form" id="sellerLoginForm">
          <label>
            Username
            <input type="text" id="sellerUsername" placeholder="seller" required />
          </label>

          <label>
            Password
            <input type="password" id="sellerPassword" placeholder="monsneakz123" required />
          </label>

          <button class="primary-btn" type="submit">Login to Seller Portal</button>
        </form>
      </section>

      <section class="card dashboard" id="sellerDashboard">
        <div class="dashboard-grid">
          <div>
            <h2>Add New Product</h2>
            <form class="seller-form" id="sellerProductForm">
              <label>
                Product Name
                <input type="text" id="sellerName" placeholder="Air Max Runner" required />
              </label>

              <label>
                Brand
                <input type="text" id="sellerBrand" placeholder="Nike" required />
              </label>

              <label>
                Category
                <select id="sellerCategory">
                  <option value="Nike">Nike</option>
                  <option value="New Balance">New Balance</option>
                  <option value="Jordan">Jordan</option>
                  <option value="Adidas">Adidas</option>
                </select>
              </label>

              <label>
                Price
                <input type="number" id="sellerPrice" min="1" step="0.01" placeholder="1499.00" required />
              </label>

              <label>
                Old Price
                <input type="number" id="sellerOldPrice" min="1" step="0.01" placeholder="1999.00" />
              </label>

              <label>
                Product Pictures
                <div class="upload-box">
                  <input type="file" id="sellerImage" accept="image/*" multiple />
                  <div class="preview-row" id="imagePreviewRow"></div>
                  <button type="button" class="ghost-btn" id="clearImageSelection">Remove selected images</button>
                </div>
              </label>

              <button class="primary-btn" type="submit">Add Product</button>
            </form>
          </div>

          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;">
              <h2 style="margin:0;">Seller Listings</h2>
              <span id="sellerSessionBadge">Not logged in</span>
            </div>
            <div id="sellerProductList"></div>
            <div class="logout-row">
              <button class="second-btn" id="logoutSeller" type="button">Log Out</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="products.js"></script>
  </body>
</html>
